<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PromptShare — соцсеть для обмена промтами</title>
  <meta name="description" content="PromptShare — публикуйте, обсуждайте и находите промты для ChatGPT, Claude, Midjourney, DALL·E, Stable Diffusion и других нейросетей.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    // Тема выставляется до первой отрисовки, чтобы не было вспышки.
    try {
      const saved = localStorage.getItem('ps-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      else if (window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
    } catch (_) {}
  </script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot">Загружаем PromptShare…</div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
